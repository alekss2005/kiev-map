let backoffMs=0,abortCtrl=null,savedThreats=null,savedAlerts=null,savedMessages=null;
function persistToStorage(){try{localStorage.setItem("kt_v12s_cache",JSON.stringify({ts:Date.now(),threats:savedThreats,alerts:savedAlerts,messages:savedMessages}))}catch{}}
function restoreFromStorage(){try{const raw=localStorage.getItem("kt_v12s_cache");if(!raw)return false;const data=JSON.parse(raw);if(Date.now()-data.ts>30*60*1000)return false;savedThreats=data.threats;savedAlerts=data.alerts;savedMessages=data.messages;applyData(data.threats||[],data.alerts||{},data.messages||[]);return true}catch{return false}}
function applyData(threats,alerts,messages){syncThreats(threats);try{syncAlertPolygons(alerts)}catch(e){console.warn(e)}try{syncMessageThreats(messages)}catch(e){console.warn(e)}updateStats(threats,alerts)}
async function fetchData(){const badge=$("liveBadge");if(abortCtrl)abortCtrl.abort();abortCtrl=new AbortController();const signal=abortCtrl.signal;try{const[tr,al,msg]=await Promise.all([fetch(CONFIG.API_THREATS,{signal}).then(r=>{if(!r.ok)throw new Error("threats "+r.status);return r.json()}),fetch(CONFIG.API_ALERTS,{signal}).then(r=>{if(!r.ok)throw new Error("alerts "+r.status);return r.json()}),fetch(CONFIG.API_MESSAGES,{signal}).then(r=>r.json()).catch(()=>({messages:[]}))]);const threats=tr.threats||[];savedThreats=threats;savedAlerts=al;savedMessages=msg.messages||[];applyData(threats,al,msg.messages||[]);badge.textContent="онлайн";badge.classList.add("live");backoffMs=0;persistToStorage();checkKyivProximity(threats)}catch(e){if(e.name==="AbortError")return;console.error(e);badge.textContent="ошибка";badge.classList.remove("live");backoffMs=Math.min((backoffMs||CONFIG.POLL_MS)*2,CONFIG.MAX_BACKOFF_MS)}}
let lastKyivAlertAt=0,audioCtx=null;
function playAlertBeep(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();const now=audioCtx.currentTime;for(let i=0;i<3;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="square";o.frequency.value=880;g.gain.setValueAtTime(0.0001,now+i*.28);g.gain.exponentialRampToValueAtTime(.25,now+i*.28+.02);g.gain.exponentialRampToValueAtTime(0.0001,now+i*.28+.2);o.connect(g);g.connect(audioCtx.destination);o.start(now+i*.28);o.stop(now+i*.28+.22)}}catch(e){console.warn("audio",e)}}
function checkKyivProximity(threats){let nearest=Infinity;for(const raw of threats||[]){const t=normalizeThreat(raw);if(t.status==="resolved"||t.lat==null||t.lon==null)continue;const d=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],t.lat,t.lon);if(d<nearest)nearest=d}for(const o of msgMarkers.values()){const ll=o.marker.getLatLng();const d=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],ll.lat,ll.lng);if(d<nearest)nearest=d}if(nearest<=CONFIG.KYIV_ALERT_KM){const now=Date.now();if(now-lastKyivAlertAt>60000){lastKyivAlertAt=now;playAlertBeep();const badge=$("liveBadge");if(badge){badge.textContent="⚠ Київ ≤50 км";badge.style.background="#7f1d1d";badge.style.color="#fecaca"}}}}
let pollTimer=null;
async function pollLoop(){await fetchData();pollTimer=setTimeout(pollLoop,backoffMs>0?backoffMs:CONFIG.POLL_MS)}
function startPolling(){if(pollTimer)clearTimeout(pollTimer);pollLoop()}
function stopPolling(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null}if(abortCtrl){abortCtrl.abort();abortCtrl=null}}
function exportJson(){const payload={exportedAt:new Date().toISOString(),threats:savedThreats||[],alerts:savedAlerts||{},messages:savedMessages||[]};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="karta-trevog-"+Date.now()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast("Экспортировано")}
$("btnRefresh").addEventListener("click",()=>{backoffMs=0;startPolling()});
$("btnExport").addEventListener("click",exportJson);
document.addEventListener("click",()=>{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()});
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopPolling();stopAnim()}else{startPolling();startAnim()}});
(async function init(){const ctrl=new AbortController();loadAlertGeo(ctrl.signal);const hadCache=restoreFromStorage();if(!hadCache)showToast("Загрузка…");startPolling();startAnim()})();
</script>
</body>
</html>
