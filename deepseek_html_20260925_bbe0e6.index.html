<style>

    --accent:#2563eb;--danger:#dc2626;--ok:#16a34a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}

  #map .err b{display:block;margin-bottom:6px;font-size:16px}
  #map .err code{background:#fee2e2;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px}

  .hud-top{position:absolute;top:8px;left:10px;right:10px;z-index:1000;
    display:flex;flex-direction:column;gap:3px;pointer-events:none}

  .hud-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

    box-shadow:0 2px 8px rgba(15,23,42,.12)}

  .stat .num{font-size:.72rem;font-weight:700;line-height:1.1;color:#64748b}
  .stat .lbl{font-size:.42rem;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
  .stat.uav .num{color:#ea580c}
  .stat.missile .num{color:var(--danger)}
  .stat.kab .num{color:#dc2626}
  .stat.bander .num{color:#dc2626}
  .stat.jet .num{color:#b91c1c}
  .stat.mig .num{color:#e11d48}
  .stat.strat .num{color:#ea580c}
  .stat.impact .num{color:#b91c1c}

  }
  .tm-header{display:flex;align-items:center;gap:8px;padding:4px 10px;height:24px}
  .tm-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;
    box-shadow:0 0 6px currentColor}
  .tm-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm-score{font-family:ui-monospace,monospace;font-size:.6rem;
    padding:1px 5px;border-radius:4px;flex-shrink:0}
  .tm-chev{flex-shrink:0;font-size:.65rem;transition:transform .2s;opacity:.7}
  .threat-meter.open .tm-chev{transform:rotate(180deg)}
  .tm-body{max-height:0;overflow:hidden;transition:max-height .3s ease-out}

    font-weight:500;border-bottom:1px solid rgba(148,163,184,.15)}

  .threat-meter.yellow .tm-dot{color:#ca8a04;background:#ca8a04}
  .threat-meter.yellow .tm-score{color:#854d0e;background:rgba(202,138,4,.12)}
  .threat-meter.orange{background:linear-gradient(90deg,rgba(255,237,213,.97),rgba(254,243,199,.97));border-color:#fb923c;color:#9a3412}
  .threat-meter.orange .tm-dot{color:#ea580c;background:#ea580c}
  .threat-meter.orange .tm-score{color:#9a3412;background:rgba(234,88,12,.12)}
  .threat-meter.red{background:linear-gradient(90deg,rgba(254,226,226,.97),rgba(255,228,230,.97));border-color:#f87171;color:#991b1b}
  .threat-meter.red .tm-dot{color:#dc2626;background:#dc2626}
  .threat-meter.red .tm-score{color:#991b1b;background:rgba(220,38,38,.15)}

    display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}

  button{background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(148,163,184,.5);
    color:var(--text);padding:6px 12px;border-radius:8px;font-size:1rem;line-height:1;
    cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.12);font-weight:700}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .attr{font-size:.6rem;color:var(--muted);line-height:1.35;background:var(--panel);

    background:#7f1d1d;color:#fecaca;font-size:9.5px;font-weight:800;
    padding:2px 5px;border-radius:4px;white-space:nowrap;border:1px solid #dc2626;pointer-events:none}
  .count-badge{position:absolute;right:-6px;top:-6px;height:16px;min-width:16px;padding:0 5px;

    display:flex;align-items:center;justify-content:center;border:1px solid #fff;line-height:1}

  .stage-badge.warn{background:#b45309;border-color:#f59e0b}
  .stage-badge.ready{background:#9a3412;border-color:#ea580c}
  .stage-badge.takeoff{background:#7c2d12;border-color:#ea580c}
  .stage-badge.observe{background:#334155;border-color:#64748b}
  .falling-badge{position:absolute;left:50%;top:-16px;transform:translateX(-50%);
    background:#7f1d1d;color:#fecaca;font-size:9px;font-weight:800;
    padding:1px 5px;border-radius:4px;white-space:nowrap;border:1px solid #dc2626}

  .zone-circle{fill:rgba(59,130,246,.05);stroke:#3b82f6;stroke-width:1.5;
    stroke-dasharray:6 4;opacity:.5;pointer-events:none}
  .leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.8)!important;color:#64748b!important}
  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:2000;
    background:#1e293b;color:#f1f5f9;padding:10px 16px;border-radius:10px;
    border:1px solid rgba(148,163,184,.4);font-size:.8rem;box-shadow:0 8px 24px rgba(0,0,0,.3);
    opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>

  window.__errors.push(e);
  var m = document.getElementById("map");

});

function haversineKm(lat1, lon1, lat2, lon2) {
  var R = 6371, toRad = function(d){ return d * Math.PI / 180; };
  var dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2 * R * Math.asin(Math.sqrt(a));
}
function bearingBetween(lat1, lon1, lat2, lon2) {
  var φ1 = lat1*Math.PI/180, φ2 = lat2*Math.PI/180;
  var Δλ = (lon2-lon1)*Math.PI/180;
  var y = Math.sin(Δλ)*Math.cos(φ2);
  var x = Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function destPoint(lat, lon, bearingDeg, distKm) {
  var R = 6371, br = bearingDeg*Math.PI/180;
  var lat1 = lat*Math.PI/180, lon1 = lon*Math.PI/180;
  var lat2 = Math.asin(Math.sin(lat1)*Math.cos(distKm/R) +
    Math.cos(lat1)*Math.sin(distKm/R)*Math.cos(br));
  var lon2 = lon1 + Math.atan2(Math.sin(br)*Math.sin(distKm/R)*Math.cos(lat1),
    Math.cos(distKm/R)-Math.sin(lat1)*Math.sin(lat2));
  return [lat2*180/Math.PI, lon2*180/Math.PI];
}

function parseDualPosition(text) {
  var result = { observed:null, target:null };
  if (!text) return result;
  var obsMatch = OBSERVED_BY_RE.exec(text);
  if (obsMatch) {
    var tailStart = obsMatch.index + obsMatch[0].length;
    var p = findPlaceInTail(text, tailStart, 30);
    if (p) result.observed = p;
  }
  var tgtMatch = TARGET_BY_RE.exec(text);
  if (tgtMatch) {
    var cand = String(tgtMatch[1]||"").trim().toLowerCase();
    for (var i=0; i<PLACE_KEYS_BY_LEN.length; i++) {
      var key = PLACE_KEYS_BY_LEN[i];
      if (cand.indexOf(key) >= 0 || key.indexOf(cand) >= 0) {
        var p2 = PLACES[key];
        result.target = { key:key, name:p2[2], lat:p2[0], lon:p2[1] };
        break;
      }
    }
    if (!result.target) {
      var ob = findOblastInText(tgtMatch[1]||"");
      if (ob) result.target = { key:ob.key, name:ob.name, lat:ob.lat, lon:ob.lon };
    }

}
function parseFromTo(text) {

  if (!text) return result;
  var m = FROM_TO_RE.exec(text);
  if (!m) return result;
  var fromOb = findOblastInText(m[1]);
  if (fromOb) result.from = { key:fromOb.key, name:fromOb.name, lat:fromOb.lat, lon:fromOb.lon };
  var toOb = findOblastInText(m[2]);
  if (toOb) result.to = { key:toOb.key, name:toOb.name, lat:toOb.lat, lon:toOb.lon };
  else {
    var toPlace = findPlaceInText(m[2]);

var READY_RE = /бойов[аоі]й?\s+готовност|боев[оа]й?\s+готовност|готов[іи]\s+до\s+застосування|готовы\s+к\s+применению/i;

function detectStage(text) {
  if (!text) return null;
  if (NON_AIR_RE.test(text)) return null;
  if (/відбій|отбой|загроза\s+миновала|угроза\s+миновала/i.test(text)) return null;
  if (/зліт|злет|взлет|взліт|вилетів|вылетел|уже\s+в\s+воздух|уже\s+в\s+повітрі/i.test(text)) return "takeoff";
  if (/пуск|пуски|запуск|запуски|старт|стартував|уже\s+в\s+повітр|уже\s+в\s+воздух/i.test(text)) return "launch";
  if (READY_RE.test(text)) return "ready";
  if (THREAT_RE.test(text)) return "threat";
  return null;
}

function parseAltitude(t) {
  if (typeof t.altitude === "number") return Math.round(t.altitude);
  if (typeof t.alt === "number") return Math.round(t.alt);
  var text = [t.title, t.explanationShort, t.text].filter(Boolean).join(" ");
  if (!text) return null;
  var m = text.match(/(?:висот[аіиою]|высот[аеыою]|на\s+висот[іи]|на\s+высот[е])\s*[:=]?\s*(\d+(?:[.,]\d+)?)\s*(км|km|м|m)\b/i);
  if (m) {
    var v = parseFloat(m[1].replace(",", "."));
    var unit = m[2].toLowerCase();
    var meters = (unit === "км" || unit === "km") ? v * 1000 : v;
    if (meters >= 50 && meters <= 20000) return Math.round(meters);
  }
  m = text.match(/(\d{3,5})\s*(?:м|m\b)/i);
  if (m) {
    var v2 = parseInt(m[1],10);
    if (v2 >= 50 && v2 <= 20000) return v2;
  }
  m = text.match(/(\d+(?:[.,]\d+)?)\s*(?:км|km)\b/i);
  if (m) {
    var v3 = parseFloat(m[1].replace(",", ".")) * 1000;
    if (v3 >= 50 && v3 <= 20000) return Math.round(v3);
  }
  return null;
}
function formatAlt(alt) {
  if (alt == null) return "";
  return alt >= 1000 ? (alt/1000).toFixed(1).replace(/\.0$/, "") + " км" : alt + " м";
}
function formatEta(min) {
  if (min < 0.5) return "< 1 мин";
  if (min < 60) return "~" + Math.round(min) + " мин";
  var h = Math.floor(min / 60);
  var m = Math.round(min % 60);
  return "~" + h + " ч " + m + " мин";
}

============================================================ */
function parseMessageThreat(msg) {
  var text = [msg.title, msg.text, msg.message, msg.explanationShort].filter(Boolean).join(" \n ");
  if (!text) return [];
  if (NON_AIR_RE.test(text)) return [];
  var cls = CLASSIFIER(text);
  if (!cls) return [];
  var stage = detectStage(text);
  if (!cls.hard && stage === null) return [];

  var dual = parseDualPosition(text);
  var fromTo = parseFromTo(text);
  var place = dual.observed || findPlaceInText(text);
  var oblastOnly = null;
  if (!place) {
    var ob = findOblastInText(text);
    if (ob) oblastOnly = ob;
  }
  if (fromTo.from && !place && !oblastOnly) {
    oblastOnly = fromTo.from;
  }

  var lat = null, lon = null, name = "—", isGuess = false, areaOnly = false;
  var toLat = null, toLon = null, toName = "";

  var targetLike = cls.isMissile || cls.isBanderol || cls.isJetDrone ||
    cls.type === "uav" || cls.type === "recon" || cls.type === "fpv";

  if (place) {
    lat = place.lat; lon = place.lon; name = place.name; isGuess = true;
  } else if (oblastOnly) {
    lat = oblastOnly.lat; lon = oblastOnly.lon; name = oblastOnly.name;
    isGuess = true; areaOnly = true;
  } else {
    lat = 48.0; lon = 38.0; name = "Схід (оцінка)"; isGuess = true;
  }

  if (dual.target) { toLat = dual.target.lat; toLon = dual.target.lon; toName = dual.target.name; }
  if (fromTo.to && !toName) { toLat = fromTo.to.lat; toLon = fromTo.to.lon; toName = fromTo.to.name; }

  if (toLat != null && targetLike && !areaOnly && lat != null) {
    var distToTarget = haversineKm(lat, lon, toLat, toLon);
    if (distToTarget >= 3) {
      var bearing = bearingBetween(lat, lon, toLat, toLon);
      var offsetKm = cls.isBanderol ? CONFIG.BANDEROL_OFFSET_KM : CONFIG.PRE_TARGET_OFFSET_KM;
      var pos = destPoint(toLat, toLon, (bearing + 180) % 360, offsetKm);
      lat = pos[0]; lon = pos[1];
    }
  }

  var msgDate = msg.date || msg.createdAt || msg.publishedAt || null;
  return [{
    type: cls.type, label: cls.label, hard: !!cls.hard,
    isMissile: !!cls.isMissile, isKAB: !!cls.isKAB, isBanderol: !!cls.isBanderol,
    isJetDrone: !!cls.isJetDrone, isMig: !!cls.isMig, isStrategic: !!cls.isStrategic,
    isAwacs: !!cls.isAwacs, geran5: !!cls.geran5,
    lat: lat, lon: lon, name: name, isGuess: isGuess, areaOnly: areaOnly,
    stage: stage, toLat: toLat, toLon: toLon, toName: toName,
    text: text.slice(0, 400),
    msgDate: msgDate,
    channel: msg.channel || msg.source || "",
    msgId: msg.id || msg.msgId || null
  }];
}

  var fallingHtml = falling ? '<div class="falling-badge">↓ ПАДАЄ</div>' : "";

  var stageHtml = "";
  if (stage === "threat") stageHtml = '<div class="stage-badge warn">⚠ ЗАГРОЗА</div>';
  else if (stage === "launch") stageHtml = '<div class="stage-badge">🚀 ПУСК</div>';
  else if (stage === "takeoff") stageHtml = '<div class="stage-badge takeoff">✈ ВЗЛЁТ</div>';
  else if (stage === "ready") stageHtml = '<div class="stage-badge ready">⚠ ГОТОВНІСТЬ</div>';

  var badgeColor = meta.isStrategic ? "#9a3412" : meta.isMissile ? "#7f1d1d" :
                   meta.isMig ? "#7c2d12" : "#1e293b";
  var labelHtml = lbl
    ? '<div style="position:absolute;left:50%;top:100%;margin-top:2px;transform:translateX(-50%);' +
      'background:' + badgeColor + ';color:#fff;font-size:8px;font-weight:800;' +
      'padding:1px 4px;border-radius:3px;border:1px solid rgba(255,255,255,.3);white-space:nowrap">' + lbl + '</div>'
    : "";

  var html = '<div style="position:relative;width:28px;height:28px">' +
    '<div class="' + iconClasses.join(" ") + '" style="position:absolute;inset:0;transform:rotate(' + h + 'deg)">' + arrow + svg + '</div>' +
    labelHtml + altHtml + countHtml + fallingHtml + stageHtml +
    '</div>';

  return L.divIcon({
    className: "",
    html: html,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -14]
  });
}

/* ============================================================
   POPUP
============================================================ */
function popupHtml(t, confirmations) {
  var meta = getMeta(t.type);
  var label = t.geran5 ? "Герань-5" : meta.label;
  var loc = t.name || "—";
  var alt = t._altitude;
  var altLine = alt != null ? "<br>Высота: " + formatAlt(alt) : "";
  var eta = t._eta;
  var etaLine = (eta != null && eta > 0 && !OBSERVATION_TYPES[t.type] && !t.areaOnly)
    ? '<div class="popup-eta">⏱ Время подлёта: ' + formatEta(eta) + '</div>' : "";
  var toLine = t.toName ? "<br>🎯 Цель: <b>" + esc(t.toName) + "</b>" : "";
  var chLine = t.channel ? '<div class="popup-channels"><b>Источник:</b> <span class="ch">' + esc(t.channel) + '</span></div>' : "";
  var guessNote = t.isGuess ? '<div class="popup-guess">⚠ Позиция — населённый пункт из сообщения, не радар.</div>' : "";
  var areaNote = t.areaOnly ? '<div class="popup-guess">≈ Названа только область.</div>' : "";

  return '<div class="popup-title type-' + t.type + '">' + label + '</div>' +
    '<div>' + esc(t.text || "") + '</div>' +
    etaLine +
    '<div class="popup-meta" style="margin-top:6px">' +
    'Місце: ' + esc(loc) + toLine + altLine +
    (confirmations ? '<br>Подтверждений: <b>' + confirmations + '</b>' : '') +
    '</div>' + chLine + guessNote + areaNote;
}

/* ============================================================
   ХРАНИЛИЩЕ И ОТРИСОВКА
============================================================ */
var activeThreats = new Map();

function threatKey(t) {
  return t.type + "|" + (t.lat||0).toFixed(2) + "|" + (t.lon||0).toFixed(2);
}

function createOrUpdateThreat(t, now) {
  var key = threatKey(t);
  var rec = activeThreats.get(key);
  if (!rec) {
    var keys = Array.from(activeThreats.keys());
    for (var i=0; i<keys.length; i++) {
      var r = activeThreats.get(keys[i]);
      if (r.threat.type !== t.type) continue;
      if (haversineKm(r.threat.lat, r.threat.lon, t.lat, t.lon) <= CONFIG.DEDUP_DIST_KM) {
        rec = r; break;
      }
    }
  }
  if (rec) {
    for (var k in t) if (t.hasOwnProperty(k)) rec.threat[k] = t[k];
    rec.lastSeen = now;
    rec.confirmN = (rec.confirmN || 1) + 1;
  } else {
    rec = {
      threat: t,
      marker: null,
      confirmN: 1,
      lastSeen: now
    };
    activeThreats.set(key, rec);
  }
  renderThreat(rec);
}

function renderThreat(rec) {
  var t = rec.threat;
  var meta = getMeta(t.type);
  var heading = null;
  if (t.lat != null && t.lon != null) {
    var launch = nearestLaunch(t.lat, t.lon);
    heading = bearingBetween(launch.lat, launch.lon, t.lat, t.lon);
  }
  var eta = null;
  if (t._altitude != null && t.lat != null && !t.areaOnly && !OBSERVATION_TYPES[t.type]) {
    var speed = meta.isMissile ? 800 : meta.isUav ? 180 : 500;
    var d = haversineKm(t.lat, t.lon, CONFIG.KYIV[0], CONFIG.KYIV[1]);
    eta = (d / speed) * 60;
  }
  t._eta = eta;

  var icon = makeIcon(t, heading, rec.confirmN);

  if (!rec.marker) {
    rec.marker = L.marker([t.lat, t.lon], { icon: icon });
    rec.marker.bindPopup(function(){
      return popupHtml(t, rec.confirmN);
    }, { maxWidth: 340 });
    rec.marker.addTo(msgThreatLayer);
  } else {
    rec.marker.setLatLng([t.lat, t.lon]);
    rec.marker.setIcon(icon);
  }
}

function cleanupOldThreats(now) {
  var ttl = CONFIG.STALE_MSG_MS * 6;
  activeThreats.forEach(function(rec, key){
    if (now - rec.lastSeen > ttl) {
      try { msgThreatLayer.removeLayer(rec.marker); } catch(e){}
      activeThreats.delete(key);
    }
  });
}

/* ============================================================
   СТАТИСТИКА
============================================================ */
function updateStats() {
  var uav=0, missile=0, jet=0, bander=0, kab=0, mig=0, strat=0;
  activeThreats.forEach(function(rec){
    var t = rec.threat;
    if (t.type === "uav" || t.type === "recon") uav++;
    else if (t.type === "missile" || t.type === "ballistic") missile++;
    else if (t.type === "jet_drone") jet++;
    else if (t.type === "banderol") bander++;
    else if (t.type === "kab" || t.type === "umpb") kab++;
    else if (t.type === "mig31k") mig++;
    else if (t.type === "strategic_aviation") strat++;
  });
  $("cntUav").textContent = uav;
  $("cntMissile").textContent = missile;
  $("cntJet").textContent = jet;
  $("cntBander").textContent = bander;
  $("cntKab").textContent = kab;
  $("cntMig").textContent = mig;
  $("cntStrat").textContent = strat;
}

/* ============================================================
   ИНДИКАТОР УГРОЗЫ
============================================================ */
function updateThreatMeter() {
  var score = 0;
  var rows = [];
  var hasUav=false, hasMissile=false, hasBallistic=false, hasMig=false, hasStrat=false;
  activeThreats.forEach(function(rec){
    var t = rec.threat;
    var d = haversineKm(t.lat, t.lon, CONFIG.KYIV[0], CONFIG.KYIV[1]);
    if (d > CONFIG.ZONE_RADIUS_KM) return;
    if (t.type === "uav" || t.type === "recon" || t.type === "fpv") hasUav = true;
    if (t.type === "missile" || t.type === "banderol" || t.type === "jet_drone") hasMissile = true;
    if (t.type === "ballistic") hasBallistic = true;
    if (t.type === "mig31k") hasMig = true;
    if (t.type === "strategic_aviation") hasStrat = true;
  });

  var W = CONFIG.METER_WEIGHTS;
  function addRow(ico, label, active, weight) {
    rows.push({ ico:ico, label:label, active:active, weight:weight });
    if (active) score += weight;
  }
  addRow("🛩", "БПЛА в зоне", hasUav, W.uav_launch);
  addRow("🚀", "Ракеты/Бандероль", hasMissile, W.missile_launch);
  addRow("⚡", "Баллистика", hasBallistic, W.ballistic);
  addRow("✈", "МиГ-31К", hasMig, W.mig);
  addRow("🛫", "Стратег. авиация", hasStrat, W.strategic);

  var capped = Math.min(score, CONFIG.METER_MAX);
  var level = "green";
  if (capped >= 8) level = "red";
  else if (capped >= 5) level = "orange";
  else if (capped >= 1) level = "yellow";

  var meter = $("threatMeter");
  meter.className = "threat-meter " + level + (meter.classList.contains("open") ? " open" : "");
  $("tmScore").textContent = capped + "/" + CONFIG.METER_MAX;

  var texts = {
    green: "Спокойно · признаков тревоги нет",
    yellow: "Внимание · есть активность",
    orange: "Опасность · активность в зоне",
    red: "КРИТИЧНО · массовая угроза"
  };
  $("tmText").textContent = texts[level];

  var body = $("tmBody");
  body.innerHTML = rows.map(function(r){
    return '<div class="tm-row ' + (r.active ? "active" : "idle") + '">' +
      '<span class="ico">' + r.ico + '</span>' +
      '<span class="label">' + r.label + '</span>' +
      '<span class="weight">' + (r.active ? "+" + r.weight : "0") + '</span></div>';
  }).join("");
}

/* ============================================================
   ЗАГРУЗКА
============================================================ */
var backoff = 1000;
var fetchErrors = 0;

function fetchMessages() {
  return fetch(CONFIG.API_MESSAGES)
    .then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data){
      var items = Array.isArray(data) ? data : (data.messages || data.items || []);
      var now = Date.now();
      var added = 0;
      for (var i=0; i<items.length; i++) {
        try {
          var threats = parseMessageThreat(items[i]);
          for (var j=0; j<threats.length; j++) {
            var t = threats[j];
            t._altitude = parseAltitude(t);
            t._falling = /падає|падает|сбит|збит|упал|упав/i.test(t.text || "");
            createOrUpdateThreat(t, now);
            added++;
          }
        } catch(e) { /* пропускаем битые */ }
      }
      cleanupOldThreats(now);
      updateStats();
      updateThreatMeter();
      var badge = $("liveBadge");
      badge.className = "badge live";
      badge.textContent = "LIVE · " + added;
      fetchErrors = 0;
      backoff = 1000;
    })
    .catch(function(e){
      fetchErrors++;
      var badge = $("liveBadge");
      badge.className = "badge stale";
      badge.textContent = "STALE (err " + fetchErrors + ")";
      console.warn("fetch failed", e);
      backoff = Math.min(backoff * 1.8, 60000);
    });
}

/* ============================================================
   INIT
============================================================ */
var map = L.map("map", {
  center: CONFIG.KYIV,
  zoom: 8,
  zoomControl: true,
  attributionControl: true
});

L.tileLayer(CONFIG.TILE_URL, {
  maxZoom: 19,
  attribution: CONFIG.TILE_ATTR
}).addTo(map);

L.circle(CONFIG.KYIV, {
  radius: CONFIG.ZONE_RADIUS_KM * 1000,
  className: "zone-circle",
  interactive: false
}).addTo(map);

var msgThreatLayer = L.layerGroup().addTo(map);
var trailLayer = L.layerGroup().addTo(map);

$("btnRefresh").addEventListener("click", function(){
  showToast("Обновление…");
  fetchMessages().then(loopNext);
});

var threatMeter = $("threatMeter");
threatMeter.addEventListener("click", function(){
  threatMeter.classList.toggle("open");
});

var toastTimer = null;
function showToast(msg, ms) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, ms || 2000);
}

function loopNext() {
  setTimeout(function(){
    fetchMessages().then(loopNext);
  }, Math.max(backoff, CONFIG.POLL_MS));
}

fetchMessages().then(loopNext);

// переодический пересчёт метра
setInterval(function(){
  updateThreatMeter();
  updateStats();
}, 5000);

setTimeout(function(){ showToast("Карта загружена", 1500); }, 300);

})();
</script>
